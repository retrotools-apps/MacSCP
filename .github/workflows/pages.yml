name: MacSCP website

on:
  push:
    branches: [main]
    paths:
      - 'docs/web/**'
      - 'scripts/prepare-website'
      - 'scripts/website_documents.py'
      - 'scripts/tests/test_website*.py'
      - 'VERSION'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'licenses/**'
      - 'THIRD_PARTY_NOTICES.md'
      - 'Resources/Brand/AppIcon.svg'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Verify and export the public website
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_website*.py'
          python3 scripts/prepare-website --check
          python3 scripts/prepare-website --output "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
