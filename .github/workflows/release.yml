name: RetroTools MacSCP GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag matching VERSION'
        required: true

permissions:
  contents: read

concurrency:
  group: github-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve the release tag to trusted immutable source
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      tag_object: ${{ steps.release.outputs.tag_object }}
    steps:
      - name: Resolve and validate the exact release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          TAG="$REQUESTED_TAG"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo '::error::Release input must be a bare semantic-version tag such as v1.2.3.'
            exit 1
          fi
          if [[ "$EVENT_NAME" = workflow_dispatch && "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo '::error::Manual releases must be dispatched from the default branch.'
            exit 1
          fi

          REF_JSON="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")"
          OBJECT_TYPE="$(jq -r '.object.type' <<< "$REF_JSON")"
          OBJECT_SHA="$(jq -r '.object.sha' <<< "$REF_JSON")"
          TAG_OBJECT="$OBJECT_SHA"
          DEPTH=0
          while [[ "$OBJECT_TYPE" = tag ]]; do
            DEPTH=$((DEPTH + 1))
            if (( DEPTH > 8 )); then
              echo '::error::Release tag annotation nesting is unexpectedly deep.'
              exit 1
            fi
            TAG_JSON="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$OBJECT_SHA")"
            OBJECT_TYPE="$(jq -r '.object.type' <<< "$TAG_JSON")"
            OBJECT_SHA="$(jq -r '.object.sha' <<< "$TAG_JSON")"
          done
          if [[ "$OBJECT_TYPE" != commit || ! "$OBJECT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Release tag does not resolve to a commit.'
            exit 1
          fi

          STATUS="$(gh api "repos/$GITHUB_REPOSITORY/compare/$OBJECT_SHA...$DEFAULT_BRANCH" --jq '.status')"
          if [[ "$STATUS" != ahead && "$STATUS" != identical ]]; then
            echo '::error::Release tag commit is not part of the default-branch history.'
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$OBJECT_SHA" >> "$GITHUB_OUTPUT"
          echo "tag_object=$TAG_OBJECT" >> "$GITHUB_OUTPUT"

  preflight:
    name: Validate publication and signing key before building
    needs: resolve
    runs-on: macos-15
    environment: release
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.resolve.outputs.commit }}
      - name: Verify publication inputs
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          GH_TOKEN: ${{ github.token }}
          MACSCP_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACSCP_DEVELOPER_ID_P12_BASE64 }}
          MACSCP_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACSCP_DEVELOPER_ID_P12_PASSWORD }}
          MACSCP_NOTARY_PRIVATE_KEY: ${{ secrets.MACSCP_NOTARY_PRIVATE_KEY }}
          MACSCP_NOTARY_KEY_ID: ${{ vars.MACSCP_NOTARY_KEY_ID }}
          MACSCP_NOTARY_ISSUER_ID: ${{ vars.MACSCP_NOTARY_ISSUER_ID }}
          MACSCP_SIGN_IDENTITY: ${{ vars.MACSCP_SIGN_IDENTITY }}
          MACSCP_TEAM_ID: ${{ vars.MACSCP_TEAM_ID }}
          MACSCP_SPARKLE_PRIVATE_KEY: ${{ secrets.MACSCP_SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test "$REPOSITORY_PRIVATE" = false
          bash scripts/check-release-environment
          python3 scripts/check-public-tree
          python3 scripts/release-notes "$TAG" > "$RUNNER_TEMP/release-notes.md"
          python3 -m unittest discover -s scripts/tests
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft == false) | .tag_name' > "$RUNNER_TEMP/published-tags"
          if grep -Fxq "$TAG" "$RUNNER_TEMP/published-tags"; then
            echo '::error::This version is already published. Create a new version instead.'
            exit 1
          fi
      - name: Verify Sparkle key matches the application
        env:
          MACSCP_SPARKLE_PRIVATE_KEY: ${{ secrets.MACSCP_SPARKLE_PRIVATE_KEY }}
        run: |
          swift scripts/verify-sparkle-key.swift
      - name: Verify Developer ID and notarization credentials
        env:
          MACSCP_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACSCP_DEVELOPER_ID_P12_BASE64 }}
          MACSCP_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACSCP_DEVELOPER_ID_P12_PASSWORD }}
          MACSCP_NOTARY_PRIVATE_KEY: ${{ secrets.MACSCP_NOTARY_PRIVATE_KEY }}
          MACSCP_NOTARY_KEY_ID: ${{ vars.MACSCP_NOTARY_KEY_ID }}
          MACSCP_NOTARY_ISSUER_ID: ${{ vars.MACSCP_NOTARY_ISSUER_ID }}
          MACSCP_SIGN_IDENTITY: ${{ vars.MACSCP_SIGN_IDENTITY }}
          MACSCP_TEAM_ID: ${{ vars.MACSCP_TEAM_ID }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          NOTARY_KEY_PATH="$RUNNER_TEMP/notary-api-key.p8"
          trap 'rm -f "$CERTIFICATE_PATH" "$NOTARY_KEY_PATH"' EXIT
          printf '%s' "$MACSCP_DEVELOPER_ID_P12_BASE64" | /usr/bin/base64 -D > "$CERTIFICATE_PATH"
          SUBJECT="$(P12_PASSWORD="$MACSCP_DEVELOPER_ID_P12_PASSWORD" \
            openssl pkcs12 -legacy -in "$CERTIFICATE_PATH" \
              -passin env:P12_PASSWORD -clcerts -nokeys 2>/dev/null | \
            openssl x509 -noout -subject)"
          grep -Fq "$MACSCP_SIGN_IDENTITY" <<< "$SUBJECT"
          grep -Fq "$MACSCP_TEAM_ID" <<< "$SUBJECT"
          printf '%s' "$MACSCP_NOTARY_PRIVATE_KEY" > "$NOTARY_KEY_PATH"
          xcrun notarytool history \
            --key "$NOTARY_KEY_PATH" \
            --key-id "$MACSCP_NOTARY_KEY_ID" \
            --issuer "$MACSCP_NOTARY_ISSUER_ID" \
            --output-format json >/dev/null

  store:
    name: Verify Store updater exclusion
    needs: [resolve, preflight]
    runs-on: macos-15
    timeout-minutes: 25
    env:
      MACSCP_DISTRIBUTION: app-store
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.resolve.outputs.commit }}
      - name: Verify dependencies
        run: scripts/check-vendor
      - name: Test and inspect Store executable
        run: |
          set -euo pipefail
          swift test --disable-automatic-resolution --filter 'AppUpdatePolicyTests|SparkleDistributionTests'
          swift build --product MacSCP --disable-automatic-resolution
          BIN="$(swift build --product MacSCP --show-bin-path)"
          test -x "$BIN/MacSCP"
          if otool -L "$BIN/MacSCP" | grep -Fq Sparkle; then
            echo '::error::Store executable links Sparkle'
            exit 1
          fi

  build:
    name: Build and sign free GitHub distribution
    needs: [resolve, preflight]
    runs-on: macos-latest
    timeout-minutes: 60
    environment: release
    env:
      MACSCP_DISTRIBUTION: direct
      MACSCP_BUILD: ${{ github.run_number }}
      MACSCP_SIGN_IDENTITY: ${{ vars.MACSCP_SIGN_IDENTITY }}
      MACSCP_TEAM_ID: ${{ vars.MACSCP_TEAM_ID }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.resolve.outputs.commit }}
      - name: Toolchain cache identity
        id: toolchain
        run: echo "id=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore compilation outputs
        id: cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .build/sparkle
            .build/package
          key: release-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('Vendor/checksums.json', 'Package.resolved', 'Package.swift', 'Sources/**', 'Resources/**', 'scripts/package-app', 'scripts/build-sparkle') }}
          restore-keys: |
            release-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-
      - name: Verify local dependency sources
        run: |
          scripts/check-vendor
          swift package resolve
          swift package --disable-automatic-resolution show-dependencies --format json > "$RUNNER_TEMP/dependency-graph.json"
          scripts/check-vendor --graph "$RUNNER_TEMP/dependency-graph.json"
      - name: Build Sparkle from verified sources
        run: bash scripts/build-sparkle --tools
      - name: Exercise signing before the application build
        env:
          MACSCP_SPARKLE_PRIVATE_KEY: ${{ secrets.MACSCP_SPARKLE_PRIVATE_KEY }}
        run: |
          swift scripts/verify-sparkle-key.swift
          printf 'MacSCP signing probe\n' > "$RUNNER_TEMP/signing-probe"
          KEY_INPUT="$MACSCP_SPARKLE_PRIVATE_KEY"
          KEY_INPUT="${KEY_INPUT#"${KEY_INPUT%%[![:space:]]*}"}"
          KEY_INPUT="${KEY_INPUT%"${KEY_INPUT##*[![:space:]]}"}"
          # Never print upstream diagnostics: malformed-key errors may echo input.
          printf '%s\n' "$KEY_INPUT" | .build/sparkle/Build/Products/Release/sign_update \
            --ed-key-file - -p "$RUNNER_TEMP/signing-probe" > "$RUNNER_TEMP/signing-probe.signature" 2>/dev/null
          swift scripts/verify-sparkle-key.swift Resources/Sparkle-public-key.txt \
            "$RUNNER_TEMP/signing-probe" "$RUNNER_TEMP/signing-probe.signature"
      - name: Run tests
        env:
          MACSCP_ENABLE_SPARKLE: '1'
        run: swift test --disable-automatic-resolution --disable-dependency-cache
      - name: Build, Developer ID sign and notarize GitHub DMG
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          MACSCP_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACSCP_DEVELOPER_ID_P12_BASE64 }}
          MACSCP_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACSCP_DEVELOPER_ID_P12_PASSWORD }}
          MACSCP_NOTARY_PRIVATE_KEY: ${{ secrets.MACSCP_NOTARY_PRIVATE_KEY }}
          MACSCP_NOTARY_KEY_ID: ${{ vars.MACSCP_NOTARY_KEY_ID }}
          MACSCP_NOTARY_ISSUER_ID: ${{ vars.MACSCP_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          APP="dist/MacSCP.app"
          DMG="dist/MacSCP-${VERSION}.dmg"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          NOTARY_KEY_PATH="$RUNNER_TEMP/notary-api-key.p8"
          KEYCHAIN_PATH="$RUNNER_TEMP/macscp-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 48 | tr -d '\n')"
          STAGING="$(mktemp -d "$RUNNER_TEMP/macscp-dmg.XXXXXX")"
          cleanup() {
            security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
            rm -f "$CERTIFICATE_PATH" "$NOTARY_KEY_PATH"
            rm -rf "$STAGING"
          }
          trap cleanup EXIT

          MACSCP_VERSION="$VERSION" scripts/package-app
          printf '%s' "$MACSCP_DEVELOPER_ID_P12_BASE64" | /usr/bin/base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" \
            -P "$MACSCP_DEVELOPER_ID_P12_PASSWORD" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          bash scripts/sign-app --developer-id "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          ditto "$APP" "$STAGING/MacSCP.app"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname MacSCP -srcfolder "$STAGING" -format UDZO "$DMG"
          hdiutil verify "$DMG"

          printf '%s' "$MACSCP_NOTARY_PRIVATE_KEY" > "$NOTARY_KEY_PATH"
          xcrun notarytool submit "$DMG" \
            --key "$NOTARY_KEY_PATH" \
            --key-id "$MACSCP_NOTARY_KEY_ID" \
            --issuer "$MACSCP_NOTARY_ISSUER_ID" \
            --wait --output-format json > "$RUNNER_TEMP/notary-result.json"
          jq -e '.status == "Accepted"' "$RUNNER_TEMP/notary-result.json" >/dev/null
          jq -r '"Apple notarization accepted: " + .id' "$RUNNER_TEMP/notary-result.json"
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          hdiutil verify "$DMG"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
      - name: Save compilation outputs before publication
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .build/sparkle
            .build/package
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Preserve the DMG for recovery without rebuilding
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-dmg
          path: dist/MacSCP-*.dmg
          if-no-files-found: error
          retention-days: 7
      - name: Sign Sparkle appcast
        env:
          MACSCP_SPARKLE_PRIVATE_KEY: ${{ secrets.MACSCP_SPARKLE_PRIVATE_KEY }}
        run: bash scripts/generate-appcast
      - name: Upload verified distribution
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: signed-distribution
          path: |
            dist/MacSCP-*.dmg
            dist/appcast.xml
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attest and publish after all checks pass
    needs: [resolve, build, store]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Verify the release tag has not moved
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          EXPECTED_TAG_OBJECT: ${{ needs.resolve.outputs.tag_object }}
        run: |
          set -euo pipefail
          CURRENT_TAG_OBJECT="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          if [[ "$CURRENT_TAG_OBJECT" != "$EXPECTED_TAG_OBJECT" ]]; then
            echo '::error::Release tag changed after validation.'
            exit 1
          fi
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.resolve.outputs.commit }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: signed-distribution
          path: dist
      - name: Release metadata
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          python3 scripts/release-notes "$TAG" > "$RUNNER_TEMP/release-notes.md"
          echo "MACSCP_VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Generate GitHub provenance attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          create-storage-record: false
          subject-path: |
            dist/MacSCP-${{ env.MACSCP_VERSION }}.dmg
            dist/appcast.xml
      - name: Upload verified assets to a draft release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          body_path: ${{ runner.temp }}/release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/MacSCP-${{ env.MACSCP_VERSION }}.dmg
            dist/appcast.xml
          draft: true
          prerelease: ${{ contains(needs.resolve.outputs.tag, '-') }}
      - name: Publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
