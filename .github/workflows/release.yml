name: RetroTools MacSCP GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0) — must match VERSION and already exist'
        required: true

permissions:
  contents: read

concurrency:
  group: github-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  changelog:
    name: Validate curated release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Verify release credentials are configured
        env:
          MACSCP_SPARKLE_PRIVATE_KEY: ${{ secrets.MACSCP_SPARKLE_PRIVATE_KEY }}
        shell: bash
        run: bash scripts/check-release-environment

      - name: Verify publication inputs
        run: |
          python3 scripts/check-public-tree
          python3 -m unittest discover -s scripts/tests -p 'test_public_tree.py'

      - name: Extract version-matched release notes
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: python3 scripts/release-notes "$TAG" > RELEASE_NOTES.md

  build:
    name: Build and attest free GitHub distribution
    needs: changelog
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      MACSCP_DISTRIBUTION: direct
      MACSCP_BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # workflow_dispatch runs from a branch ref; build the TAGGED source
          # either way so a re-dispatch can never ship a moved HEAD.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Verify public publication target and version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$REPOSITORY_PRIVATE" != false ]; then
            echo '::error::This free attested-release workflow requires a public repository.'
            exit 1
          fi
          python3 scripts/release-notes "$TAG" > "$RUNNER_TEMP/release-notes.md"
          echo "MACSCP_VERSION=${TAG#v}" >> "$GITHUB_ENV"
          # Never replace the assets of an already published version.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft == false) | .tag_name' > "$RUNNER_TEMP/published-tags"
          if grep -Fxq "$TAG" "$RUNNER_TEMP/published-tags"; then
            echo '::error::This version is already published. Create a new version instead.'
            exit 1
          fi

      - name: Verify local dependency sources
        run: |
          scripts/check-vendor
          swift package resolve
          swift package --disable-automatic-resolution show-dependencies --format json > "$RUNNER_TEMP/dependency-graph.json"
          scripts/check-vendor --graph "$RUNNER_TEMP/dependency-graph.json"

      - name: Verify Store updater exclusion
        env:
          MACSCP_DISTRIBUTION: app-store
        run: |
          swift test --disable-automatic-resolution --filter 'AppUpdatePolicyTests|SparkleDistributionTests'
          swift build --product MacSCP --disable-automatic-resolution
          BIN="$(swift build --product MacSCP --show-bin-path)"
          test -x "$BIN/MacSCP"
          LINKS="$(otool -L "$BIN/MacSCP")"
          if grep -Fq Sparkle <<< "$LINKS"; then
            echo 'error: Store executable links Sparkle' >&2
            exit 1
          fi

      - name: Build Sparkle from verified sources
        run: bash scripts/build-sparkle --tools

      - name: Run tests
        # A tag can point at any commit — never sign and ship untested code.
        env:
          MACSCP_ENABLE_SPARKLE: '1'
        run: swift test --disable-automatic-resolution --disable-dependency-cache

      - name: Build ad-hoc signed GitHub DMG
        run: bash scripts/release

      - name: Sign Sparkle appcast
        env:
          MACSCP_SPARKLE_PRIVATE_KEY: ${{ secrets.MACSCP_SPARKLE_PRIVATE_KEY }}
        run: bash scripts/generate-appcast

      - name: Generate GitHub provenance attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          create-storage-record: false
          subject-path: |
            dist/MacSCP-${{ env.MACSCP_VERSION }}.dmg
            dist/appcast.xml

      - name: Upload verified assets to a draft release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/MacSCP-${{ env.MACSCP_VERSION }}.dmg
            dist/appcast.xml
          draft: true
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}

      - name: Publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
